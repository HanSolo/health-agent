# ********** Swift system monitor with websocket connection on port 8787 ******
metrics.ws.uri=ws://127.0.0.1:8787
metrics.ws.reconnect-seconds=5

# ********** Payara agentic runtime: local Ollama *****************************
# Run first: ollama pull your model e.g. quen3.8:27b (Ollama must be running on the base URL below -> ollama run gema3:4b) or qwen3.8:27b
# With provider "none" (Payara's default) the LLM is a silent no-op, so the agent uses its rule-based fallback.
payara.agentic.llm.provider=ollama
payara.agentic.llm.model=qwen3.8:27b
payara.agentic.llm.ollama.base-url=http://localhost:11434
payara.agentic.llm.max-tokens=700
payara.agentic.llm.system=You are a careful macOS performance analyst. You get measurements from a monitoring app and explain them briefly and factually for the owner of the Mac. Never invent processes or numbers.

# ********** When to wake the agent *******************************************
# Average over the window, in percent. CPU is the average over ALL cores, so a single busy
# core on a many-core Mac barely moves it. For a demo, lower alerts.cpu.percent (for example
# to 20) and run "yes > /dev/null" in a terminal, or just use "Analyze now" on the page.
alerts.window-seconds=30
alerts.cpu.percent=85
alerts.memory.percent=92
alerts.battery.percent=20
alerts.disk-capacity.percent=90
# The same kind of alert is not raised again within this many seconds.
alerts.cooldown-seconds=300
